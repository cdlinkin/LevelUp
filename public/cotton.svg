<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360">
  <filter id="cotton" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.50  0 0 0 0 0.44  0 0 0 0 0.34  0.12 0.12 0.12 0 0"/>
  </filter>
  <rect width="360" height="360" filter="url(#cotton)"/>
