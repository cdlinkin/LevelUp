<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" role="img" aria-label="LevelUp">
  <style>
    .bar { fill: #f4f6fb; transform-box: fill-box; transform-origin: center bottom; }
    .hot { fill: #ff4b3e; }
    .b1 { animation: rise 2.8s ease-in-out infinite; }
    .b2 { animation: rise 2.8s ease-in-out 0.12s infinite; }
    .b3 { animation: rise 2.8s ease-in-out 0.24s infinite; }
    .chev { fill: none; stroke: #ff4b3e; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transform-box: fill-box; transform-origin: center; animation: lift 2.8s ease-in-out infinite; }
    .name { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size: 32px; letter-spacing: -1.4px; }
    @keyframes rise {
      0%, 100% { transform: scaleY(0.62); }
      42%, 72% { transform: scaleY(1); }
    }
    @keyframes lift {
      0%, 100% { transform: translateY(3px); opacity: 0.55; }
      42%, 72% { transform: translateY(0); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .b1, .b2, .b3, .chev { animation: none; }
    }
  </style>
  <rect class="bar b1" x="4" y="34" width="8" height="18" rx="2"/>
  <rect class="bar b2" x="16" y="24" width="8" height="28" rx="2"/>
  <rect class="bar hot b3" x="28" y="14" width="8" height="38" rx="2"/>
  <path class="chev" d="M26 12 L32 5 L38 12"/>
  <text class="name" x="50" y="44">
    <tspan fill="#f4f6fb" font-weight="700">Level</tspan><tspan class="hot" font-weight="700">Up</tspan>
  </text>
</svg>
