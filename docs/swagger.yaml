basePath: /api/v1
definitions:
  github_com_cdlinkin_LevelUp_internal_core_transport_http_response.ErrorResponse:
    properties:
      error:
        example: full error text
        type: string
      message:
        example: short human-readable message
        type: string
    type: object
  internal_features_auth_transport_http.LoginRequest:
    properties:
      email:
        example: roman@mail.ru
        type: string
      password:
        example: secret123
        type: string
    required:
    - email
    - password
    type: object
  internal_features_auth_transport_http.LoginResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        example: 86400
        type: integer
      token_type:
        example: Bearer
        type: string
    type: object
  internal_features_auth_transport_http.RegisterRequest:
    properties:
      email:
        example: roman@mail.ru
        type: string
      full_name:
        example: Roman Romanovich
        maxLength: 100
        minLength: 3
        type: string
      password:
        example: secret123
        type: string
      phone_number:
        example: "+79998887766"
        maxLength: 15
        minLength: 10
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  internal_features_auth_transport_http.RegisterResponse:
    properties:
      email:
        example: roman@mail.ru
        type: string
      full_name:
        example: Roman Romanovich
        type: string
      id:
        example: 1
        type: integer
      phone_number:
        example: "+79998887766"
        type: string
